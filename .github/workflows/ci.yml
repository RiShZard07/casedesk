name: CaseDesk Java and React Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: mkdir -p build
      - run: javac -d build src/*.java tests/CaseDeskTest.java
      - run: java -cp build CaseDeskTest
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:ui
